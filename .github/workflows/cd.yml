name: CI/CD Deploy a AWS

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Docker Hub (o ECR)
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build y Push del frontend
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/spa-frontend:latest \
            ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/spa-frontend:latest

      - name: Desplegar en EC2 frontend
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_FRONT_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/spa-frontend:latest
            docker stop spa-frontend || true
            docker rm spa-frontend || true
            docker run -d \
              --name spa-frontend \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/spa-frontend:latest